<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Campus Issue Tracker</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">
                <i class="fas fa-cube"></i>
            </div>
            <div class="brand-text">
                <h2>CAMPUS</h2>
                <p>ISSUE TRACKER</p>
            </div>
            <div class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-chart-pie"></i> <span>Analytics</span>
            </a>
            <a href="tickets.html" class="nav-item">
                <i class="fas fa-tasks"></i> <span>All Tickets</span>
            </a>
            <a href="users.html" class="nav-item">
                <i class="fas fa-users-cog"></i> <span>User Management</span>
            </a>
            <a href="departments.html" class="nav-item">
                <i class="fas fa-building"></i> <span>Departments</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-file-invoice"></i> <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">Reports</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn search-btn">
                    <i class="fas fa-search"></i>
                </button>
                <button class="icon-btn notification-btn">
                    <i class="far fa-bell"></i>
                    <span class="badge" id="notifBadge">0</span>
                </button>
                <button class="icon-btn settings-btn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0b132a&color=fff&rounded=true" alt="Admin" class="avatar" id="headerAvatar">
                </div>
            </div>
        </header>

        <!-- Dashboard Content Container -->
        <main class="content-container">
            
            <div id="reports-view" class="dashboard-view active">
                <div class="card" style="padding: 3rem; text-align: center;">
                    <h2>Reports</h2>
                    <p style="color: var(--text-light); margin-top: 1rem;">Generate and export historical data reports.</p>
                </div>
            </div>
            
            <footer class="main-footer">
                <p>&copy; 2026 Campus Issue Tracker. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="js/nav-active.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
