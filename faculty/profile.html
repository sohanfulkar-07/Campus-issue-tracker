<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Faculty Dashboard</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- Auth Router -->
    <script src="../js/auth-router.js"></script>
    <!-- Theme Script -->
    <script src="js/theme.js"></script>
    <style>
        .profile-container {
            max-width: 800px;
            margin-top: 2rem;
        }
        .profile-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .profile-header-bg {
            height: 120px;
            background: linear-gradient(135deg, #0b132a 0%, #1e293b 100%);
            position: relative;
        }
        .profile-avatar-container {
            position: relative;
            margin-top: -60px;
            margin-left: 2rem;
            display: inline-block;
        }
        .profile-avatar-container img {
            border: 4px solid var(--card-bg);
            background: var(--card-bg);
        }
        .profile-info {
            padding: 1.5rem 2rem;
        }
        .profile-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .profile-name-row h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: inherit;
        }
        .form-control:read-only {
            background-color: #f8fafc;
            border-color: transparent;
            font-weight: 500;
        }
        .form-control:not(:read-only):focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }
        .modal-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }
        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">
                <i class="fas fa-cube"></i>
            </div>
            <div class="brand-text">
                <h2>CAMPUS</h2>
                <p>ISSUE TRACKER</p>
            </div>
            <div class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> <span>Dashboard</span>
            </a>
            <a href="report-history.html" class="nav-item">
                <i class="fas fa-history"></i> <span>Report Resolved History</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-wrapper">
        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <img src="" alt="Profile" class="avatar" id="headerAvatar">
                </div>
            </div>
        </header>

        <main class="content-container">
            <div class="welcome-section">
                <h1>Faculty Profile</h1>
                <p>Manage your personal information and contact details.</p>
            </div>

            <div class="profile-container">
                <div class="profile-card">
                    <div class="profile-header-bg"></div>
                    <div class="profile-avatar-container">
                        <img src="" alt="Avatar" width="120" height="120" style="border-radius: 50%;" id="pageAvatar">
                    </div>
                    
                    <div class="profile-info">
                        <div class="profile-name-row">
                            <h2 id="displayName">Faculty Name</h2>
                            <div>
                                <button class="btn-primary" id="btnEditProfile"><i class="fas fa-pen"></i> Edit Profile</button>
                                <button class="btn-primary" id="btnSaveProfile" style="display: none; background: var(--success-color);"><i class="fas fa-save"></i> Save Changes</button>
                                <button class="btn-outline-sm" id="btnCancelEdit" style="display: none; margin-left: 0.5rem;">Cancel</button>
                            </div>
                        </div>

                        <form id="profileForm">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Full Name</label>
                                    <input type="text" id="editName" class="form-control" readonly>
                                </div>
                                <div class="form-group">
                                    <label>Designation</label>
                                    <input type="text" id="editDesignation" class="form-control" readonly>
                                </div>
                            </div>
                            <div class="form-grid mt-3" style="margin-top: 1.5rem;">
                                <div class="form-group">
                                    <label>Employee ID</label>
                                    <input type="text" id="editEmpId" class="form-control" readonly>
                                </div>
                                <div class="form-group">
                                    <label>Department</label>
                                    <input type="text" id="editDept" class="form-control" readonly>
                                </div>
                            </div>
                            <div class="form-grid mt-3" style="margin-top: 1.5rem;">
                                <div class="form-group">
                                    <label>Office Phone</label>
                                    <input type="tel" id="editPhone" class="form-control" readonly>
                                </div>
                                <div class="form-group">
                                    <label>Official Email</label>
                                    <input type="email" id="editEmail" class="form-control" readonly>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Password Verification Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-card">
            <h3 class="modal-title"><i class="fas fa-lock" style="color: var(--warning-color); margin-right: 0.5rem;"></i> Security Verification</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Please enter your login password to unlock profile editing.</p>
            
            <div class="form-group">
                <input type="password" id="verifyPasswordInput" class="form-control" placeholder="Enter password" style="background: white;">
                <div class="error-msg" id="passwordErrorMsg">Incorrect password. Please try again.</div>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn-outline-sm" id="btnCancelModal" style="flex: 1; padding: 0.75rem;">Cancel</button>
                <button class="btn-primary" id="btnVerifyPassword" style="flex: 1; padding: 0.75rem;">Verify & Unlock</button>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="js/dashboard.js"></script>
    <script src="js/profile-data.js"></script> <!-- To load header avatar -->
    <script src="js/profile-edit.js"></script>
</body>
</html>
