<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeal College | Official Campus Portal</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="split-container">
        <!-- Left Side: Branding & Illustration -->
        <div class="left-side">
            <div class="branding-content">
                <div class="logo">
                    <i class="fas fa-university"></i>
                </div>
                <h1 class="title">Zeal College of Engineering &amp; Research</h1>
                <h2 class="subtitle">Official Campus Issue Portal</h2>
                <p class="small-text">A modern and secure platform for reporting and resolving campus concerns in Pune.</p>
            </div>
        </div>
----------
        <!-- Right Side: Login Form -->
        <div class="right-side">
            <div class="login-card">
                
                <div class="card-header">
                    <h2>Welcome Back</h2>
                    <p>Select your role and sign in to continue.</p>
                </div>

                <!-- Role Selection Tabs -->
                <div class="role-tabs">
                    <button class="role-tab active" data-role="student" data-icon="fa-user-graduate" data-title="Student Login" data-label="Student ID" data-redirect="student/dashboard.html">
                        <i class="fas fa-user-graduate"></i> Student
                    </button>
                    <button class="role-tab" data-role="faculty" data-icon="fa-chalkboard-teacher" data-title="Faculty Login" data-label="Faculty ID" data-redirect="faculty/dashboard.html">
                        <i class="fas fa-chalkboard-teacher"></i> Faculty
                    </button>
                    <button class="role-tab" data-role="other" data-icon="fa-user-shield" data-title="Admin Login" data-label="Admin ID" data-redirect="admin/dashboard.html">
                        <i class="fas fa-user-shield"></i> Admin
                    </button>
                </div>
                
                <div class="dynamic-header">
                    <div class="role-icon" id="dynamicRoleIcon">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h3 id="dynamicRoleTitle">Student Login</h3>
                </div>

                <form id="unifiedLoginForm" class="login-form">
                    <div class="input-group">
                        <label for="userId" id="dynamicUserIdLabel">Student ID</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-badge icon"></i>
                            <input type="text" id="userId" placeholder="Enter Student ID" autocomplete="username">
                        </div>
                        <span class="error-message" id="userIdError"></span>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember Me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">Login</span>
                        <div class="spinner" id="btnSpinner"></div>
                    </button>
                    
                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="btn-secondary">
                        <i class="fab fa-microsoft"></i> Login using College Email
                    </button>
                </form>

                <div class="card-footer">
                    <p>Don't have access? <a href="#">Contact Administrator</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Custom JS -->
    <script src="assets/js/login.js"></script>
</body>
</html>
